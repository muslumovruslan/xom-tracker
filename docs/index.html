<!DOCTYPE html>
<html>

<head>

<title>XOM Financial Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

</head>

<body>

<div class="container">

<h1>XOM Financial Dashboard</h1>

<div class="menu">

<button onclick="drawChart('1D')">1 Day</button>

<button onclick="drawChart('3D')">3 Days</button>

<button onclick="drawChart('1W')">1 Week</button>

<button onclick="drawChart('1M')">1 Month</button>

<button onclick="drawChart('6M')">6 Months</button>

<button onclick="drawChart('1Y')">1 Year</button>

<button onclick="saveCurrentData()">
Save Current Data
</button>

</div>

<div id="chart"></div>

<div id="saved-list"></div>

</div>

<script src="script.js"></script>

</body>

</html>
